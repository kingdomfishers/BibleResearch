<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img"><rect width="1600" height="990" fill="#f5f7fb"/><rect x="0" y="0" width="1600" height="64" rx="0" fill="#14233b" stroke="#14233b" stroke-width="1"/><text x="28" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="26" font-weight="700" fill="#f5f7ff" text-anchor="start">▣ BibleResearch</text><text x="245" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="700" fill="#dce4ee" text-anchor="start">Explore</text><text x="336" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="400" fill="#a2b4ff" text-anchor="start">Compare</text><text x="443" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="400" fill="#dce4ee" text-anchor="start">Graph</text><text x="531" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="400" fill="#dce4ee" text-anchor="start">Tools</text><rect x="1180" y="15" width="380" height="36" rx="8" fill="#f7f9fe" stroke="#a3b4c7" stroke-width="1"/><text x="1197" y="39" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="400" fill="#7b8496" text-anchor="start">Search verses, words, topics …</text><rect x="0" y="64" width="1600" height="57" rx="0" fill="#ffffff" stroke="#d8e0ea" stroke-width="1"/><text x="26" y="99" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="700" fill="#24314a" text-anchor="start">← Back   |   Genesis 2:7   ›   adamah   ›   Genesis 3:19</text><rect x="1260" y="75" width="86" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="1303" y="98" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Fork</text><rect x="1354" y="75" width="108" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="1408" y="98" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Compare</text><rect x="1473" y="75" width="102" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="1524" y="98" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">+ Note</text><rect x="20" y="141" width="1559" height="89" rx="12" fill="#fff" stroke="#d7dfe9" stroke-width="1"/><text x="44" y="174" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#20314e" text-anchor="start">Compare two passages without replacing either text</text><rect x="44" y="186" width="95" height="36" rx="9" fill="#4b54b9" stroke="#4b54b9" stroke-width="1"/><text x="91.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Pin A</text><rect x="152" y="186" width="95" height="36" rx="9" fill="#4b54b9" stroke="#4b54b9" stroke-width="1"/><text x="199.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Pin B</text><rect x="268" y="186" width="95" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="315.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Swap</text><rect x="376" y="186" width="145" height="36" rx="9" fill="#4b54b9" stroke="#4b54b9" stroke-width="1"/><text x="448.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Exact lemma</text><rect x="530" y="186" width="114" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="587" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Grammar</text><rect x="652" y="186" width="80" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="692" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">LXX</text><rect x="741" y="186" width="115" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="798.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Imagery</text><rect x="868" y="186" width="128" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="932" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Differences</text><rect x="1007" y="186" width="108" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="1061" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Align</text><rect x="1128" y="186" width="137" height="36" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="1196.5" y="209" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#26364b" text-anchor="middle">Free scroll</text><rect x="20" y="245" width="764" height="565" rx="12" fill="#fff" stroke="#d7dfe9" stroke-width="1"/><text x="48" y="285" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#263c61" text-anchor="start">A · Genesis 2:7</text><rect x="601" y="256" width="153" height="27" rx="8" fill="#edf0ff" stroke="#edf0ff" stroke-width="1"/><text x="611" y="274" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="700" fill="#3548a2" text-anchor="start">Verse ↕ Chapter</text><text x="51" y="330" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="22" font-weight="400" fill="#253650" text-anchor="start">Yahweh God formed man from the dust of the</text><text x="51" y="367" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="22" font-weight="400" fill="#253650" text-anchor="start">ground, and breathed into his nostrils the breath</text><text x="51" y="404" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="22" font-weight="400" fill="#253650" text-anchor="start">of life; and man became a living soul.</text><rect x="45" y="461" width="172" height="155" rx="9" fill="#e0eaff" stroke="#d6dfed" stroke-width="1"/><text x="131" y="495" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">אָדָם</text><text x="131" y="521" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">adam</text><text x="131" y="545" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">man</text><text x="131" y="570" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">human · mankind</text><text x="131" y="594" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">related: ground</text><rect x="229" y="461" width="172" height="155" rx="9" fill="#e2f2d8" stroke="#d6dfed" stroke-width="1"/><text x="315" y="495" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">הָאֲדָמָה</text><text x="315" y="521" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">adamah</text><text x="315" y="545" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">ground</text><text x="315" y="570" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">soil · land</text><text x="315" y="594" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">root ʾ-d-m</text><rect x="413" y="461" width="172" height="155" rx="9" fill="#ffeaca" stroke="#d6dfed" stroke-width="1"/><text x="499" y="495" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">עָפָר</text><text x="499" y="521" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">aphar</text><text x="499" y="545" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">dust</text><text x="499" y="570" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">earth · soil</text><text x="499" y="594" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">—</text><rect x="597" y="461" width="172" height="155" rx="9" fill="#f7ebff" stroke="#d6dfed" stroke-width="1"/><text x="683" y="495" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">חַיִּים</text><text x="683" y="521" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">chayyim</text><text x="683" y="545" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">life</text><text x="683" y="570" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">living · alive</text><text x="683" y="594" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">—</text><rect x="49" y="642" width="706" height="138" rx="10" fill="#f7faff" stroke="#d5e1ed" stroke-width="1"/><text x="71" y="676" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="18" font-weight="700" fill="#2d4261" text-anchor="start">Evidence notes</text><text x="71" y="709" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="400" fill="#485a6d" text-anchor="start">adam / adamah are distinct lemmas with attested literary wordplay.</text><text x="71" y="737" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="400" fill="#485a6d" text-anchor="start">Use exact color for the same lemma; a dashed link for related roots.</text><rect x="799" y="245" width="781" height="565" rx="12" fill="#fff" stroke="#d7dfe9" stroke-width="1"/><text x="828" y="285" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#263c61" text-anchor="start">B · Genesis 3:19</text><rect x="1371" y="256" width="153" height="27" rx="8" fill="#edf0ff" stroke="#edf0ff" stroke-width="1"/><text x="1381" y="274" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="700" fill="#3548a2" text-anchor="start">Verse ↕ Chapter</text><text x="829" y="330" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="21" font-weight="400" fill="#253650" text-anchor="start">By the sweat of your face you will eat bread</text><text x="829" y="364" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="21" font-weight="400" fill="#253650" text-anchor="start">until you return to the ground, for out of it</text><text x="829" y="398" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="21" font-weight="400" fill="#253650" text-anchor="start">you were taken; for dust you are, and to dust</text><text x="829" y="432" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="21" font-weight="400" fill="#253650" text-anchor="start">you shall return.</text><rect x="822" y="478" width="173" height="155" rx="9" fill="#e2f2d8" stroke="#d6dfed" stroke-width="1"/><text x="908.5" y="512" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">הָאֲדָמָה</text><text x="908.5" y="538" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">adamah</text><text x="908.5" y="562" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">ground</text><text x="908.5" y="587" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">soil · land</text><text x="908.5" y="611" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">root ʾ-d-m</text><rect x="1007" y="478" width="173" height="155" rx="9" fill="#ffeaca" stroke="#d6dfed" stroke-width="1"/><text x="1093.5" y="512" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">עָפָר</text><text x="1093.5" y="538" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">aphar</text><text x="1093.5" y="562" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">dust</text><text x="1093.5" y="587" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">earth · soil</text><text x="1093.5" y="611" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">—</text><rect x="1192" y="478" width="173" height="155" rx="9" fill="#e7eafa" stroke="#d6dfed" stroke-width="1"/><text x="1278.5" y="512" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">תָּשׁוּב</text><text x="1278.5" y="538" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">tashuv</text><text x="1278.5" y="562" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">return</text><text x="1278.5" y="587" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">turn back</text><text x="1278.5" y="611" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">—</text><rect x="1377" y="478" width="173" height="155" rx="9" fill="#f6e6fb" stroke="#d6dfed" stroke-width="1"/><text x="1463.5" y="512" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="25" font-weight="700" fill="#1f2b43" text-anchor="middle">לֶחֶם</text><text x="1463.5" y="538" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="13" font-weight="400" fill="#35405a" text-anchor="middle">lechem</text><text x="1463.5" y="562" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="700" fill="#1f2b43" text-anchor="middle">bread</text><text x="1463.5" y="587" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="11" font-weight="400" fill="#616c7a" text-anchor="middle">food · loaf</text><text x="1463.5" y="611" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="10" font-weight="400" fill="#767e8e" text-anchor="middle">—</text><rect x="832" y="660" width="718" height="116" rx="10" fill="#f7faff" stroke="#d5e1ed" stroke-width="1"/><text x="852" y="694" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="18" font-weight="700" fill="#2d4261" text-anchor="start">Visually aligned evidence</text><text x="853" y="723" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="400" fill="#485a6d" text-anchor="start">Green = same verified ground lemma; ochre = same dust lemma.</text><text x="853" y="751" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="15" font-weight="400" fill="#485a6d" text-anchor="start">Unmatched words remain neutral. Hover to inspect the evidence.</text><rect x="20" y="826" width="1559" height="141" rx="10" fill="#fff" stroke="#cbd6e4" stroke-width="1"/><text x="45" y="858" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="18" font-weight="700" fill="#293b57" text-anchor="start">Drag-to-compare zones</text><text x="46" y="886" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="16" font-weight="400" fill="#526279" text-anchor="start">Drag a verse or word toward the left/right screen edge, or use keyboard Pin A / Pin B.</text><rect x="50" y="908" width="230" height="27" rx="8" fill="#e3e9ff" stroke="#e3e9ff" stroke-width="1"/><text x="60" y="926" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#334f8f" text-anchor="start">← Left edge: Pin A</text><rect x="307" y="908" width="240" height="27" rx="8" fill="#e3e9ff" stroke="#e3e9ff" stroke-width="1"/><text x="317" y="926" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#334f8f" text-anchor="start">Right edge: Pin B →</text><rect x="580" y="908" width="178" height="27" rx="8" fill="#f2e9fb" stroke="#f2e9fb" stroke-width="1"/><text x="590" y="926" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#604d87" text-anchor="start">Escape = cancel</text><rect x="780" y="908" width="208" height="27" rx="8" fill="#e5f4eb" stroke="#e5f4eb" stroke-width="1"/><text x="790" y="926" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#2e7450" text-anchor="start">Save comparison</text><rect x="1010" y="908" width="270" height="27" rx="8" fill="#fff1d8" stroke="#fff1d8" stroke-width="1"/><text x="1020" y="926" font-family="Inter,Arial,'Noto Sans Hebrew',sans-serif" font-size="14" font-weight="700" fill="#8a6129" text-anchor="start">Notes: hypothesis, not proof</text></svg>
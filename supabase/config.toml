project_id = "ejoperxiwxlcbsqrkrvb"

[db]
major_version = 17

[db.migrations]
# Historical pre-20261126 migrations have out-of-order timestamps and pre-Cloudflare
# reclamation schema drift. Local startup uses the production-faithful DDL baseline
# in supabase/local/ plus minimal reference seeds and post-20261126 migrations.
enabled = false

[db.seed]
enabled = true
sql_paths = [
  "./local/00_extensions.sql",
  "./local/00_production_schema.sql",
  "./local/01_minimal_seed.sql",
  "./migrations/20261126*.sql",
]

[auth]
enable_anonymous_sign_ins = true

# The Bible corpus is already public. MCP clients connect without a Supabase JWT.
# The function always reads as anon; no administrative credentials are used.
[functions.bible-mcp]
enabled = true
verify_jwt = false
entrypoint = "./functions/bible-mcp/index.ts"

[functions.bible-mcp-staging]
enabled = true
verify_jwt = false
entrypoint = "./functions/bible-mcp/staging.ts"
